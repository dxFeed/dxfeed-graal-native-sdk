name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
          fi

          if [[ -z "${TAG}" ]]; then
            echo "No release tag found"
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: ${TAG}"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${TAG}"
          echo "Release version: ${VERSION}"

      - name: Checkout release tag
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.version.outputs.tag }}"

      - name: Extract release notes
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          awk -v tag="${TAG}" '
            $0 == "## " tag {
              found = 1
              next
            }

            found && /^## v/ {
              exit
            }

            found {
              print
            }

            END {
              if (!found)
                exit 2
            }
          ' ReleaseNotes.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "Release notes for ${TAG} not found or empty"
            exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Download ZIP artifacts from Nexus
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          NEXUS="https://maven.in.devexperts.com"
          BASE="${NEXUS}/repository/qd/com/dxfeed/graal-native-sdk/${VERSION}"
          INDEX="${NEXUS}/service/rest/repository/browse/qd/com/dxfeed/graal-native-sdk/${VERSION}/"

          mkdir -p artifacts

          echo "Resolving Nexus:"
          getent ahosts maven.in.devexperts.com || true

          echo "Downloading artifact index:"
          curl \
            --fail \
            --location \
            --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 3 \
            "${INDEX}" \
            --output index.html

          echo "Artifacts found in index:"

          mapfile -t ARTIFACTS < <(
            grep -oE 'graal-native-sdk-[^"<>[:space:]]+\.zip' index.html \
              | grep -F "graal-native-sdk-${VERSION}-" \
              | sort -u
          )

          printf '  %s\n' "${ARTIFACTS[@]}"

          if [[ "${#ARTIFACTS[@]}" -eq 0 ]]; then
            echo "No ZIP artifacts found for version ${VERSION}"
            echo "Index contents:"
            cat index.html
            exit 1
          fi

          for artifact in "${ARTIFACTS[@]}"; do
            echo "Downloading ${artifact}"

            curl \
              --fail \
              --location \
              --show-error \
              --connect-timeout 15 \
              --max-time 300 \
              --retry 3 \
              "${BASE}/${artifact}" \
              --output "artifacts/${artifact}"
          done

          echo "Downloaded ${#ARTIFACTS[@]} ZIP artifact(s):"
          ls -lh artifacts/

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "${TAG}" \
            artifacts/*.zip \
            --verify-tag \
            --title "${TAG}" \
            --notes-file release-notes.md