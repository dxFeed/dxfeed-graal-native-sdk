# How this archive of the dxFeed Graal Native SDK was built.
#
# variant: empty for the regular build.
# graalvm.*: the release file of the GraalVM that built the library.
# native-image.*: what native-image resolved, from its build report (empty in the iOS archives: their build stops
#   when the object is written, before the report).
# native-image.requested-options: the options the build passed to native-image, without the paths of the build
#   machine.
sdk.version=${build.info.sdk.version}
build.timestamp=${build.info.build.timestamp}
variant=
target=${build.info.target}
graalvm.implementor=${build.info.release.IMPLEMENTOR}
graalvm.version=${build.info.release.GRAALVM_VERSION}
graalvm.java-version=${build.info.release.JAVA_VERSION}
native-image.vendor-version=${build.info.vendor.version}
native-image.java-version=${build.info.java.version}
native-image.optimization-level=${build.info.optimization.level}
native-image.march=${build.info.march}
native-image.garbage-collector=${build.info.garbage.collector}
native-image.pgo=${build.info.pgo}
native-image.c-compiler=${build.info.c.compiler}
native-image.requested-options=${build.info.requested.options}
